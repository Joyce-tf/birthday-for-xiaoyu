<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 小鱼24岁生日纪念册</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sky: #87CEEB;
    --sky-light: #B0E0E6;
    --sky-pale: #E0F7FA;
    --pink: #FFB6C1;
    --pink-deep: #FF69B4;
    --gold: #FFD700;
    --paper: #FFFEF9;
    --paper-dark: #F5F0E8;
    --text: #4a6d8c;
    --text-dark: #3a5a78;
    --cover: #2c5f8a;
    --cover-light: #3a7db8;
  }

  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky-light) 40%, var(--sky-pale) 70%, var(--sky-light) 100%);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background-attachment: fixed;
  }

  /* ===== Floating Clouds ===== */
  .clouds { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .cloud {
    position: absolute; background: rgba(255,255,255,0.6); border-radius: 50%;
    animation: floatCloud linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.6); border-radius: 50%;
  }
  .cloud:nth-child(1) { width: 140px; height: 55px; top: 3%; animation-duration: 28s; }
  .cloud:nth-child(1)::before { width: 70px; height: 70px; top: -35px; left: 25px; }
  .cloud:nth-child(1)::after { width: 90px; height: 55px; top: -22px; left: 55px; }
  .cloud:nth-child(2) { width: 180px; height: 65px; top: 12%; animation-duration: 35s; animation-delay: 6s; }
  .cloud:nth-child(2)::before { width: 85px; height: 85px; top: -42px; left: 30px; }
  .cloud:nth-child(2)::after { width: 110px; height: 65px; top: -28px; left: 70px; }
  .cloud:nth-child(3) { width: 120px; height: 45px; top: 22%; animation-duration: 24s; animation-delay: 12s; }
  .cloud:nth-child(3)::before { width: 60px; height: 60px; top: -30px; left: 20px; }
  .cloud:nth-child(3)::after { width: 75px; height: 45px; top: -18px; left: 48px; }
  .cloud:nth-child(4) { width: 160px; height: 60px; top: 6%; animation-duration: 32s; animation-delay: 3s; }
  .cloud:nth-child(4)::before { width: 80px; height: 80px; top: -40px; left: 28px; }
  .cloud:nth-child(4)::after { width: 100px; height: 60px; top: -25px; left: 65px; }
  .cloud:nth-child(5) { width: 100px; height: 40px; top: 18%; animation-duration: 26s; animation-delay: 9s; }
  .cloud:nth-child(5)::before { width: 50px; height: 50px; top: -25px; left: 18px; }
  .cloud:nth-child(5)::after { width: 65px; height: 40px; top: -15px; left: 42px; }
  @keyframes floatCloud {
    from { transform: translateX(-300px); }
    to { transform: translateX(calc(100vw + 300px)); }
  }

  /* ===== Floating Decorations ===== */
  .floating-decor {
    position: fixed; pointer-events: none; z-index: 1;
    animation: floatUpDown ease-in-out infinite;
    font-size: 1.5rem;
  }
  @keyframes floatUpDown {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(8deg); }
  }

  /* ===== Password Gate ===== */
  .password-gate {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky-light) 50%, var(--sky-pale) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9999; transition: opacity 0.6s, visibility 0.6s;
  }
  .password-gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .password-gate-icon { font-size: 5rem; animation: bounceIn 1s ease, floatUpDown 2.5s ease-in-out infinite; margin-bottom: 20px; }
  @keyframes bounceIn {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.15); }
    70% { transform: scale(0.95); }
    100% { transform: scale(1); opacity: 1; }
  }
  .password-gate-title { font-size: 1.6rem; color: #3a5a78; font-weight: 600; margin-bottom: 8px; }
  .password-gate-subtitle { font-size: 1rem; color: rgba(58,90,120,0.7); margin-bottom: 30px; font-weight: 300; }
  .password-input-wrap { display: flex; gap: 10px; align-items: center; }
  .password-input {
    padding: 14px 24px; font-size: 1.1rem; border: 2px solid rgba(255,255,255,0.6);
    border-radius: 50px; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px);
    color: var(--text); outline: none; width: 240px; text-align: center; letter-spacing: 2px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .password-input:focus { border-color: var(--pink); box-shadow: 0 0 20px rgba(255,182,193,0.3); }
  .password-submit {
    padding: 14px 30px; font-size: 1.1rem; background: linear-gradient(135deg, var(--pink-deep), var(--pink));
    color: #fff; border: none; border-radius: 50px; cursor: pointer; font-weight: 600;
    transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(255,105,180,0.3);
  }
  .password-submit:hover { transform: scale(1.05); box-shadow: 0 6px 25px rgba(255,105,180,0.5); }
  .password-error { color: var(--pink-deep); font-size: 0.9rem; margin-top: 12px; min-height: 20px; }
  .password-error.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .password-hint { font-size: 0.8rem; color: rgba(58,90,120,0.5); margin-top: 20px; font-weight: 300; }

  /* ===== Main Book Container ===== */
  .app-container {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 900px; padding: 20px;
  }

  /* ===== Book ===== */
  .book-wrapper {
    perspective: 2000px;
    width: 100%; max-width: 750px;
    margin: 0 auto;
  }
  .book {
    position: relative;
    width: 100%;
    padding-bottom: 70%;
    transform-style: preserve-3d;
  }

  /* ===== Page ===== */
  .page {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .page.flipped {
    transform: rotateY(-180deg);
  }
  .page-front, .page-back {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    backface-visibility: hidden;
    border-radius: 4px 12px 12px 4px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .page-front {
    background: var(--paper);
    z-index: 2;
  }
  .page-back {
    transform: rotateY(180deg);
    background: var(--paper-dark);
  }

  /* ===== Cover Page ===== */
  .page.cover .page-front {
    background: linear-gradient(135deg, var(--cover) 0%, var(--cover-light) 50%, var(--cover) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 8px 16px 16px 8px;
    border: 3px solid rgba(255,255,255,0.2);
    box-shadow: 0 8px 40px rgba(44,95,138,0.3);
  }
  .cover-title {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    color: #fff;
    font-weight: 700;
    text-align: center;
    line-height: 1.6;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    padding: 20px;
  }
  .cover-subtitle {
    font-size: 1.1rem;
    color: rgba(255,255,255,0.85);
    font-weight: 300;
    margin-top: 10px;
    letter-spacing: 3px;
  }
  .cover-decoration {
    font-size: 4rem;
    margin: 20px 0;
    animation: floatUpDown 2.5s ease-in-out infinite;
  }
  .cover-hint {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.6);
    margin-top: 30px;
    animation: gentlePulse 2s ease-in-out infinite;
  }
  @keyframes gentlePulse {
    0%,100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* ===== Page Content Layout ===== */
  .page-content {
    display: flex;
    width: 100%; height: 100%;
  }
  .page-left {
    width: 50%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 25px;
    background: linear-gradient(135deg, rgba(135,206,235,0.08) 0%, rgba(255,182,193,0.05) 100%);
    border-right: 1px dashed rgba(135,206,235,0.3);
  }
  .page-right {
    width: 50%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 25px;
    position: relative;
  }
  .page-age {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(3.5rem, 8vw, 5rem);
    font-weight: 700;
    background: linear-gradient(135deg, var(--sky), var(--pink-deep));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .page-age-suffix {
    font-size: 1rem;
    color: var(--sky);
    font-weight: 400;
    -webkit-text-fill-color: var(--sky);
    margin-top: 2px;
  }
  .page-emoji {
    font-size: clamp(3rem, 7vw, 4.5rem);
    margin: 15px 0;
    animation: wiggleSlow 4s ease-in-out infinite;
  }
  @keyframes wiggleSlow {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(4deg); }
    75% { transform: rotate(-4deg); }
  }
  .page-gift-name {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(1.1rem, 2.5vw, 1.4rem);
    font-weight: 600;
    color: var(--text-dark);
    text-align: center;
    margin-top: 5px;
  }
  .page-gift-desc {
    font-size: clamp(0.85rem, 2vw, 1rem);
    color: var(--text);
    text-align: center;
    line-height: 1.8;
    margin-top: 15px;
    font-weight: 300;
    padding: 0 10px;
  }
  .page-badge {
    display: inline-block;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #66ccff;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    margin-top: 12px;
    border: 1px solid #66ccff;
    font-weight: 400;
  }
  .page-decor-left {
    text-align: center;
    color: rgba(74,109,140,0.5);
    font-size: 0.85rem;
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
  }
  .page-decor-left-emoji {
    font-size: 2.5rem;
    margin-bottom: 10px;
    opacity: 0.6;
  }
  .page-corner {
    position: absolute;
    bottom: 15px; right: 20px;
    font-size: 0.75rem;
    color: rgba(135,206,235,0.5);
    font-family: 'Noto Serif SC', serif;
  }

  /* ===== Navigation ===== */
  .nav-controls {
    display: flex; align-items: center; gap: 20px;
    margin-top: 25px;
    z-index: 10;
  }
  .nav-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.6);
    cursor: pointer;
    font-size: 1.3rem;
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(135,206,235,0.2);
    user-select: none;
  }
  .nav-btn:hover { transform: scale(1.1); box-shadow: 0 6px 25px rgba(135,206,235,0.4); }
  .nav-btn:active { transform: scale(0.95); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .page-indicator {
    font-size: 1rem;
    color: #3a5a78;
    font-weight: 500;
    min-width: 80px;
    text-align: center;
    font-family: 'Noto Serif SC', serif;
  }
  .nav-hint {
    font-size: 0.8rem;
    color: rgba(58,90,120,0.5);
    margin-top: 8px;
    font-weight: 300;
  }

  /* ===== Final Page ===== */
  .page.final .page-right {
    background: linear-gradient(135deg, rgba(255,182,193,0.1) 0%, rgba(135,206,235,0.1) 100%);
  }
  .final-message {
    text-align: center;
    font-family: 'Noto Serif SC', serif;
  }
  .final-message h2 {
    font-size: clamp(1.3rem, 3vw, 1.6rem);
    color: var(--pink-deep);
    margin-bottom: 15px;
  }
  .final-message p {
    font-size: 0.9rem;
    color: var(--text);
    line-height: 2;
    font-weight: 300;
  }
  .final-hearts {
    font-size: 2rem;
    animation: floatUpDown 2s ease-in-out infinite;
    margin-top: 10px;
  }

  /* ===== Confetti ===== */
  .confetti-container {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
  }
  .confetti-piece {
    position: absolute; width: 10px; height: 10px; border-radius: 3px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
  }

  /* ===== Mobile ===== */
  @media (max-width: 600px) {
    .book { padding-bottom: 100%; }
    .page-left { padding: 15px; }
    .page-right { padding: 15px; }
    .page-age { font-size: 3rem; }
    .page-emoji { font-size: 2.5rem; }
    .page-gift-name { font-size: 1rem; }
    .page-gift-desc { font-size: 0.8rem; line-height: 1.6; }
    .cover-title { font-size: 1.5rem; }
    .nav-btn { width: 42px; height: 42px; font-size: 1.1rem; }
    .password-input { width: 200px; }
  }
</style>
</head>
<body>

<!-- Floating Clouds -->
<div class="clouds">
  <div class="cloud"></div><div class="cloud"></div><div class="cloud"></div>
  <div class="cloud"></div><div class="cloud"></div>
</div>

<!-- Floating Decorations -->
<div class="floating-decor" style="top:6%;left:5%;">⭐</div>
<div class="floating-decor" style="top:15%;right:8%;animation-delay:0.5s;">💕</div>
<div class="floating-decor" style="top:35%;left:3%;animation-delay:1s;">✨</div>
<div class="floating-decor" style="top:55%;right:5%;animation-delay:0.3s;">🌟</div>
<div class="floating-decor" style="top:75%;left:7%;animation-delay:1.5s;">💖</div>
<div class="floating-decor" style="top:85%;right:10%;animation-delay:0.8s;">💫</div>

<!-- Confetti -->
<div class="confetti-container" id="confetti"></div>

<!-- Password Gate -->
<div class="password-gate" id="passwordGate">
  <div class="password-gate-icon">📖</div>
  <div class="password-gate-title">一本神秘的纪念册</div>
  <div class="password-gate-subtitle">请输入密码翻开</div>
  <div class="password-input-wrap">
    <input type="password" class="password-input" id="passwordInput" placeholder="输入密码" maxlength="30">
    <button class="password-submit" onclick="checkPassword()">📖 翻开</button>
  </div>
  <div class="password-error" id="passwordError"></div>
  <div class="password-hint">💡 只有小鱼知道的密码</div>
</div>

<!-- App -->
<div class="app-container" id="appContainer" style="display:none;">
  <div class="book-wrapper" id="bookWrapper">
    <div class="book" id="book"></div>
  </div>
  <div class="nav-controls">
    <button class="nav-btn" id="prevBtn" onclick="prevPage()" title="上一页">◀</button>
    <span class="page-indicator" id="pageIndicator">封面</span>
    <button class="nav-btn" id="nextBtn" onclick="nextPage()" title="下一页">▶</button>
  </div>
  <div class="nav-hint">💡 也可以点击书页翻页，或按键盘 ← →</div>
</div>

<script>
// ===== Password Check =====
const CORRECT_PASSWORD = '5210909';

function checkPassword() {
  const input = document.getElementById('passwordInput');
  const error = document.getElementById('passwordError');
  const gate = document.getElementById('passwordGate');
  const app = document.getElementById('appContainer');

  if (input.value === CORRECT_PASSWORD) {
    gate.classList.add('hidden');
    app.style.display = 'flex';
    sessionStorage.setItem('unlocked', 'true');
    initBook();
  } else {
    error.textContent = '密码不对哦，再想想～';
    error.classList.add('shake');
    setTimeout(() => error.classList.remove('shake'), 400);
    input.value = '';
    input.focus();
  }
}

document.addEventListener('DOMContentLoaded', function() {
  const pwInput = document.getElementById('passwordInput');
  pwInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkPassword();
  });
  if (sessionStorage.getItem('unlocked') === 'true') {
    document.getElementById('passwordGate').classList.add('hidden');
    document.getElementById('appContainer').style.display = 'flex';
    initBook();
  }
});

// ===== Gift Data =====
const gifts = [
  { age: 0, emoji: '📰', name: '02年9月9日的报纸', desc: '你来到这个世界的那一天\n报纸上写着2002年9月9日' },
  { age: 1, emoji: '🥛', name: '旺仔牛奶', desc: '甜甜的旺仔牛奶\n陪你度过咿呀学语的时光' },
  { age: 2, emoji: '🎵', name: '会唱歌的音乐盒', desc: '叮叮咚咚\n世界上最好听的声音\n是你的笑声' },
  { age: 3, emoji: '🧱', name: '积木', desc: '一块一块搭起来\n搭建属于你的小小世界' },
  { age: 4, emoji: '🧸', name: '毛绒小熊', desc: '第一个好朋友\n陪你度过每一个夜晚' },
  { age: 5, emoji: '🦸', name: '超人披风', desc: '披上它\n你就是世界上最勇敢的\n小英雄！' },
  { age: 6, emoji: '🥧', name: 'KFC蛋挞两个', desc: '两个热乎乎的蛋挞\n是童年最甜的奖励' },
  { age: 7, emoji: '🍦', name: '火炬冰柜一箱', desc: '夏天最幸福的事\n就是拥有一整箱冰棍' },
  { age: 8, emoji: '🍟', name: '脆升升一箱', desc: '嘎嘣脆的快乐\n一箱怎么够吃' },
  { age: 9, emoji: '🍧', name: 'DQ兑换券1个', desc: '一张DQ兑换券\n换来一整天的甜蜜' },
  { age: 10, emoji: '🥩', name: '野人先生兑换券1个', desc: '野人先生的烤肉\n是对勇敢小孩的奖赏' },
  { age: 11, emoji: '🎯', name: '沙包一个', desc: '扔沙包、跳房子\n童年最简单也最快乐' },
  { age: 12, emoji: '🏸', name: '羽毛球拍/手胶', desc: '挥拍、扣杀\n球场上最帅的少年' },
  { age: 13, emoji: '🍗', name: 'KFC单人餐兑换券一张', desc: '一张KFC兑换券\n就能快乐一整个下午' },
  { age: 14, emoji: '🗃️', name: '手办展示盒', desc: '开始收集喜欢的动漫手办\n每个都是心头好' },
  { age: 15, emoji: '🍀', name: '幸运御守', desc: '中考加油！\n好运永远陪伴\n努力的你' },
  { age: 16, emoji: '📷', name: '拍立得相机', desc: '咔嚓！\n记录下青春里\n每一个闪闪发光的瞬间' },
  { age: 17, emoji: '🌌', name: '星空投影灯', desc: '在房间里就能看到银河\n许下17岁的愿望' },
  { age: 18, emoji: '⭐', name: '星星纸', desc: '成年啦！\n叠一颗星星许一个愿\n把未来折进纸里' },
  { age: 19, emoji: '📱', name: '苹果13Pro手机壳', desc: '新手机的新衣服\n保护它就像保护你' },
  { age: 20, emoji: '⚙️', name: '蒸汽朋克饰品', desc: '遇见小谷\n遇见蒸汽世界\n风格独立又酷炫', badge: '🎮 Steam 特别篇' },
  { age: 21, emoji: '🎁', name: 'Steam游戏大礼包', desc: '小谷陪你度过\n无数快乐时光\nSteam库里永远有惊喜', badge: '🎮 Steam 特别篇' },
  { age: 22, emoji: '✈️', name: '旅行手账本', desc: '毕业啦！\n去看更大的世界\n记下每一段旅程' },
  { age: 23, emoji: '📸', name: '我们俩的相册', desc: '翻开这本相册\n每一页都是我们俩的故事' },
  { age: 24, emoji: '💺', name: '人体工学椅', desc: '24岁的礼物\n舒舒服服地坐着\n迎接更美好的未来' },
];

// ===== Book State =====
let currentPage = 0; // 0 = cover, 1-25 = ages 0-24
const totalPages = 26; // cover + 25 ages

function initBook() {
  const book = document.getElementById('book');
  book.innerHTML = '';
  
  // Create cover page
  const cover = createPageElement('cover', true);
  book.appendChild(cover);
  
  // Create age pages
  for (let i = 0; i < gifts.length; i++) {
    const page = createPageElement(i, false);
    book.appendChild(page);
  }
  
  updateNav();
}

function createPageElement(index, isCover) {
  const page = document.createElement('div');
  page.className = 'page';
  if (index === 'cover') {
    page.classList.add('cover');
  }
  page.dataset.index = index;
  
  // Page front
  const front = document.createElement('div');
  front.className = 'page-front';
  
  if (isCover) {
    front.innerHTML = `
      <div class="cover-decoration">🎂</div>
      <div class="cover-title">祝24岁的小鱼<br>生日快乐</div>
      <div class="cover-subtitle">· 从0岁到24岁的礼物清单 ·</div>
      <div class="cover-hint">👆 点击翻开纪念册</div>
    `;
  } else {
    const gift = gifts[index];
    const prevAge = index > 0 ? gifts[index - 1] : null;
    front.innerHTML = `
      <div class="page-content">
        <div class="page-left">
          ${prevAge ? `
            <div class="page-decor-left-emoji">${prevAge.emoji}</div>
            <div class="page-decor-left">${prevAge.age}岁</div>
            <div class="page-decor-left" style="font-size:0.75rem;margin-top:5px;">${prevAge.name}</div>
          ` : `
            <div class="page-decor-left-emoji">🎀</div>
            <div class="page-decor-left">故事的开始</div>
          `}
        </div>
        <div class="page-right">
          <div class="page-age">${gift.age}<span class="page-age-suffix"> 岁</span></div>
          <div class="page-emoji">${gift.emoji}</div>
          <div class="page-gift-name">${gift.name}</div>
          <div class="page-gift-desc">${gift.desc.replace(/\n/g, '<br>')}</div>
          ${gift.badge ? `<div class="page-badge">${gift.badge}</div>` : ''}
          <div class="page-corner">${gift.age} / 24</div>
        </div>
      </div>
    `;
  }
  
  // Page back
  const back = document.createElement('div');
  back.className = 'page-back';
  
  if (isCover) {
    back.innerHTML = `
      <div class="page-content">
        <div class="page-left" style="justify-content:center;">
          <div style="text-align:center;color:rgba(74,109,140,0.5);font-family:'Noto Serif SC',serif;">
            <div style="font-size:3rem;margin-bottom:10px;">🎮</div>
            <div style="font-size:0.9rem;">Steam玩家</div>
            <div style="font-size:0.9rem;">动漫爱好者</div>
            <div style="font-size:0.9rem;">天空蓝</div>
          </div>
        </div>
        <div class="page-right" style="justify-content:center;">
          <div style="text-align:center;font-family:'Noto Serif SC',serif;color:var(--text);">
            <div style="font-size:1.2rem;font-weight:600;margin-bottom:15px;">致小鱼</div>
            <div style="font-size:0.9rem;line-height:2;font-weight:300;">
              这本纪念册<br>
              记录了你从0岁到24岁<br>
              每一年的礼物<br>
              <br>
              翻开来看看吧 ✨
            </div>
          </div>
        </div>
      </div>
    `;
  } else {
    const gift = gifts[index];
    back.innerHTML = `
      <div class="page-content" style="flex-direction:row-reverse;">
        <div class="page-left" style="border-right:none;border-left:1px dashed rgba(135,206,235,0.3);">
          <div class="page-emoji" style="font-size:2rem;">${gift.emoji}</div>
          <div style="font-size:0.8rem;color:var(--text);text-align:center;font-weight:300;font-family:'Noto Serif SC',serif;">
            ${gift.name}
          </div>
        </div>
        <div class="page-right">
          <div style="text-align:center;color:rgba(74,109,140,0.3);font-family:'Noto Serif SC',serif;">
            <div style="font-size:2rem;">📖</div>
            <div style="font-size:0.8rem;">${gift.age}岁</div>
          </div>
        </div>
      </div>
    `;
  }
  
  page.appendChild(front);
  page.appendChild(back);
  
  // Click handler
  page.addEventListener('click', function(e) {
    const rect = page.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const isRightHalf = clickX > rect.width / 2;
    
    if (isRightHalf) {
      nextPage();
    } else {
      prevPage();
    }
  });
  
  return page;
}

function updateNav() {
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const indicator = document.getElementById('pageIndicator');
  
  prevBtn.disabled = currentPage === 0;
  nextBtn.disabled = currentPage === totalPages - 1;
  
  if (currentPage === 0) {
    indicator.textContent = '封面';
  } else {
    const gift = gifts[currentPage - 1];
    indicator.textContent = `${gift.age}岁 · ${gift.name}`;
  }
  
  // Update page z-indices and flip states
  const pages = document.querySelectorAll('.page');
  pages.forEach((page, i) => {
    const pageIndex = page.dataset.index;
    if (pageIndex === 'cover') {
      page.style.zIndex = totalPages - 0;
      page.classList.toggle('flipped', currentPage > 0);
    } else {
      const idx = parseInt(pageIndex);
      page.style.zIndex = totalPages - (idx + 1);
      page.classList.toggle('flipped', currentPage > idx + 1);
    }
  });
}

function nextPage() {
  if (currentPage < totalPages - 1) {
    currentPage++;
    updateNav();
    if (currentPage === totalPages - 1) {
      launchConfetti();
    }
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    updateNav();
  }
}

// Keyboard navigation
document.addEventListener('keydown', function(e) {
  if (document.getElementById('passwordGate').classList.contains('hidden')) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      nextPage();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      prevPage();
    }
  }
});

// Touch swipe support
let touchStartX = 0;
document.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
});
document.addEventListener('touchend', function(e) {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) > 50) {
    if (diff < 0) nextPage();
    else prevPage();
  }
});

// ===== Confetti =====
function launchConfetti() {
  const container = document.getElementById('confetti');
  const colors = ['#FFB6C1','#87CEEB','#FF69B4','#FFD700','#98FB98','#DDA0DD','#F0E68C','#87CEFA','#FFA07A','#90EE90'];
  for (let i = 0; i < 100; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
    piece.style.animationDelay = Math.random() * 1.5 + 's';
    piece.style.width = (Math.random() * 8 + 5) + 'px';
    piece.style.height = (Math.random() * 8 + 5) + 'px';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 4000);
  }
}
</script>
